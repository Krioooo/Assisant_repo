estions":[],"compliance":["本工具不直接判断客户风险等级","不得仅依据本工具作出业务准入或风险判断"],"source":"内部业务资料（Demo）","updateTime":"2026-09-20","status":"published"},{"id":"faq_007","category":"personal_fx","categoryName":"个人结售汇","question":"小孩子（未成年人）有没有5万美金额度？\nDo minors have the USD 50,000 annual quota?","keywords":["未成年人","便利化额度"],"answer":"有的，未成年人同样享有每年5万美元便利化额度。\nYes. Minors also have the annual USD 50,000 convenience quota.","keyPoints":["核实客户身份信息","了解并确认真实业务用途","根据业务场景审核相关材料","如存在疑问，按现行制度进一步核实"],"materials":["有效身份证件","与业务用途相关的证明材料","其他根据实际业务需要提供的材料"],"showKeyPoints":false,"showMaterials":false,"relatedQuestions":[],"compliance":["本工具不直接判断客户风险等级","不得仅依据本工具作出业务准入或风险判断"],"source":"内部业务资料（Demo）","updateTime":"2026-09-20","status":"published"},{"id":"faq_008","category":"personal_fx","categoryName":"个人结售汇","question":"个人购汇之后，可以把外汇转给国内其他个人吗？\nAfter purchasing foreign exchange, can I transfer FX to other individuals in China?","keywords":["购汇用途"],"answer":"仅限境内个人之间外汇划转是本人账户同名划转，或者用于规定范围内的家庭赡家款项，不能随意转账。\nDomestic individual FX transfer is only allowed for same-account transfer or family maintenance payments within specified scope. Random transfers are prohibited.","keyPoints":["核实客户身份信息","了解并确认真实业务用途","根据业务场景审核相关材料","如存在疑问，按现行制度进一步核实"],"materials":["有效身份证件","与业务用途相关的证明材料","其他根据实际业务需要提供的材料"],"showKeyPoints":false,"showMaterials":false,"relatedQuestions":[],"compliance":["本工具不直接判断客户风险等级","不得仅依据本工具作出业务准入或风险判断"],"source":"内部业务资料（Demo）","updateTime":"2026-09-20","status":"published"},{"id":"faq_009","category":"study_support","categoryName":"留学 / 赡家汇款","question":"留学学费汇款，在便利化额度内还需要提供材料吗？\nDo I need documents for overseas tuition remittance within the convenience quota?","keywords":["留学","学费","材料"],"answer":"便利化额度内凭身份证办理；如金额较大超额度，需提供录取通知、缴费单等材料。\nID is sufficient within the quota. If exceeding the quota, admission letter and payment invoice are required.","keyPoints":["核实客户身份信息","了解并确认真实业务用途","根据业务场景审核相关材料","如存在疑问，按现行制度进一步核实"],"materials":["有效身份证件","与业务用途相关的证明材料","其他根据实际业务需要提供的材料"],"showKeyPoints":false,"showMaterials":false,"relatedQuestions":[],"compliance":["本工具不直接判断客户风险等级","不得仅依据本工具作出业务准入或风险判断"],"source":"内部业务资料（Demo）","updateTime":"2026-09-20","status":"published"},{"id":"faq_010","category":"study_support","categoryName":"留学 / 赡家汇款","question":"给境外子女汇生活费，属于哪一类用途？\nWhat category does remittance of living expenses to overseas children belong to?","keywords":["生活费","留学","用途"],"answer":"属于赡家款，资金用途要真实，大额汇款建议准备亲属关系证明备查。\nIt is classified as family maintenance payment. Fund purpose must be genuine. Prepare kinship certificate for large remittances.","keyPoints":["核实客户身份信息","了解并确认真实业务用途","根据业务场景审核相关材料","如存在疑问，按现行制度进一步核实"],"materials":["有效身份证件","与业务用途相关的证明材料","其他根据实际业务需要提供的材料"],"showKeyPoints":false,"showMaterials":false,"relatedQuestions":[],"compliance":["本工具不直接判断客户风险等级","不得仅依据本工具作出业务准入或风险判断"],"source":"内部业务资料（Demo）","updateTime":"2026-09-20","status":"published"},{"id":"faq_011","category":"study_support","categoryName":"留学 / 赡家汇款","question":"多人分开购汇，汇给同一个境外收款人，是否可行？\nIs it allowed for multiple persons to buy FX separately and remit to the same overseas beneficiary?","keywords":["境外汇款"],"answer":"不可以，属于违规分拆交易，会触发风控核查，影响账户和额度。\nNo. This is illegal transaction splitting, which will trigger risk verification and affect your account and quota.","keyPoints":["核实客户身份信息","了解并确认真实业务用途","根据业务场景审核相关材料","如存在疑问，按现行制度进一步核实"],"materials":["有效身份证件","与业务用途相关的证明材料","其他根据实际业务需要提供的材料"],"showKeyPoints":false,"showMaterials":false,"relatedQuestions":[],"compliance":["本工具不直接判断客户风险等级","不得仅依据本工具作出业务准入或风险判断"],"source":"内部业务资料（Demo）","updateTime":"2026-09-20","status":"published"},{"id":"faq_012","category":"study_support","categoryName":"留学 / 赡家汇款","question":"跨境汇款提交后，多久能到境外账户？\nHow long does it take for a cross-border remittance to arrive at the overseas account after submission?","keywords":["跨境汇款","时间"],"answer":"一般1-3个工作日，受境外中转行、地区风控审核影响，存在延迟可能。\nNormally 1-3 working days. Delays may occur due to overseas correspondent banks and regional risk review.","keyPoints":["核实客户身份信息","了解并确认真实业务用途","根据业务场景审核相关材料","如存在疑问，按现行制度进一步核实"],"materials":["有效身份证件","与业务用途相关的证明材料","其他根据实际业务需要提供的材料"],"showKeyPoints":false,"showMaterials":false,"relatedQuestions":[],"compliance":["本工具不直接判断客户风险等级","不得仅依据本工具作出业务准入或风险判断"],"source":"内部业务资料（Demo）","updateTime":"2026-09-20","status":"published"},{"id":"faq_013","category":"study_support","categoryName":"留学 / 赡家汇款","question":"境外汇款被退回，手续费会不会退还？\nWill the handling fee be refunded if the overseas remittance is returned?","keywords":["汇款","手续费","退回","失败"],"answer":"中转银行手续费一般不予退回，仅本金退回。\nPrincipal will be returned, but correspondent bank charges are generally non-refundable.","keyPoints":["核实客户身份信息","了解并确认真实业务用途","根据业务场景审核相关材料","如存在疑问，按现行制度进一步核实"],"materials":["有效身份证件","与业务用途相关的证明材料","其他根据实际业务需要提供的材料"],"showKeyPoints":false,"showMaterials":false,"relatedQuestions":[],"compliance":["本工具不直接判断客户风险等级","不得仅依据本工具作出业务准入或风险判断"],"source":"内部业务资料（Demo）","updateTime":"2026-09-20","status":"published"},{"id":"faq_014","category":"study_support","categoryName":"留学 / 赡家汇款","question":"留学汇款，收款人必须是境外学校对公账户吗？\nMust the beneficiary of tuition remittance be the overseas school’s corporate account?","keywords":["学校账户","收款","留学","汇款"],"answer":"学费建议汇学校对公账户；生活费可汇境外子女个人账户，用途如实申报。\nTuition is recommended to be remitted to the school corporate account. Living expenses can go to your child’s personal account with truthful declaration.","keyPoints":["核实客户身份信息","了解并确认真实业务用途","根据业务场景审核相关材料","如存在疑问，按现行制度进一步核实"],"materials":["有效身份证件","与业务用途相关的证明材料","其他根据实际业务需要提供的材料"],"showKeyPoints":false,"showMaterials":false,"relatedQuestions":[],"compliance":["本工具不直接判断客户风险等级","不得仅依据本工具作出业务准入或风险判断"],"source":"内部业务资料（Demo）","updateTime":"2026-09-20","status":"published"},{"id":"faq_015","category":"study_support","categoryName":"留学 / 赡家汇款","question":"赡家款汇款，收款人必须是直系亲属吗？\nMust the beneficiary of family maintenance remittance be an immediate family member?\n答：推荐直系亲属，非直系亲属大额赡家汇款容易触发背景核查，需准备佐证材料。","keywords":["赡家款","收款人","汇款"],"answer":"推荐直系亲属，非直系亲属大额赡家汇款容易触发背景核查，需准备佐证材料。\nImmediate family members are preferred. Large remittances to non-immediate family members may trigger background checks with supporting documents required.","keyPoints":["核实客户身份信息","了解并确认真实业务用途","根据业务场景审核相关材料","如存在疑问，按现行制度进一步核实"],"materials":["有效身份证件","与业务用途相关的证明材料","其他根据实际业务需要提供的材料"],"showKeyPoints":false,"showMaterials":false,"relatedQuestions":[],"compliance":["本工具不直接判断客户风险等级","不得仅依据本工具作出业务准入或风险判断"],"source":"内部业务资料（Demo）","updateTime":"2026-09-20","status":"published"},{"id":"faq_016","category":"study_support","categoryName":"留学 / 赡家汇款","question":"境外收款人名字写错，汇款会怎么样？\nWhat happens if the overseas beneficiary’s name is filled incorrectly?","keywords":["收款人","汇款"],"answer":"境外银行信息校验严格，姓名、账号、开户行有误大概率会被原路退回。\nOverseas banks verify information strictly. Remittances with wrong name, account number or bank will most likely be returned.","keyPoints":["核实客户身份信息","了解并确认真实业务用途","根据业务场景审核相关材料","如存在疑问，按现行制度进一步核实"],"materials":["有效身份证件","与业务用途相关的证明材料","其他根据实际业务需要提供的材料"],"showKeyPoints":false,"showMaterials":false,"relatedQuestions":[],"compliance":["本工具不直接判断客户风险等级","不得仅依据本工具作出业务准入或风险判断"],"source":"内部业务资料（Demo）","updateTime":"2026-09-20","status":"published"},{"id":"faq_017","category":"hk_macau_taiwan","categoryName":"港澳台 & 境外个人","question":"境外个人在境内办理结汇，也享有每年5万美元便利化额度吗？\nDo non-resident individuals in China enjoy the annual USD 50,000 convenience quota for FX settlement?","keywords":["境外个人","便利化额度","结汇"],"answer":"是的，境外个人同样享有每年5万美元便利化结汇额度。\nYes. Non-resident individuals also have the annual USD 50,000 convenience quota for FX settlement.","keyPoints":["核实客户身份信息","了解并确认真实业务用途","根据业务场景审核相关材料","如存在疑问，按现行制度进一步核实"],"materials":["有效身份证件","与业务用途相关的证明材料","其他根据实际业务需要提供的材料"],"showKeyPoints":false,"showMaterials":false,"relatedQuestions":[],"compliance":["本工具不直接判断客户风险等级","不得仅依据本工具作出业务准入或风险判断"],"source":"内部业务资料（Demo）","updateTime":"2026-09-20","status":"published"},{"id":"faq_018","category":"hk_macau_taiwan","categoryName":"港澳台 & 境外个人","question":"港澳台居民持居住证，可以在我行开立账户办理跨境人民币收汇吗？\nCan Hong Kong, Macao and Taiwan residents with residence permits open accounts in our bank to receive cross-border RMB?","keywords":["港澳台","证件","开户"],"answer":"可以，凭港澳居民居住证等有效证件开户，按跨境人民币相关规定办理收汇业务。\nYes. They can open accounts with valid documents such as Mainland Residence Permit and receive funds under cross-border RMB rules.","keyPoints":["核实客户身份信息","了解并确认真实业务用途","根据业务场景审核相关材料","如存在疑问，按现行制度进一步核实"],"materials":["有效身份证件","与业务用途相关的证明材料","其他根据实际业务需要提供的材料"],"showKeyPoints":false,"showMaterials":false,"relatedQuestions":[],"compliance":["本工具不直接判断客户风险等级","不得仅依据本工具作出业务准入或风险判断"],"source":"内部业务资料（Demo）","updateTime":"2026-09-20","status":"published"},{"id":"faq_019","category":"hk_macau_taiwan","categoryName":"港澳台 & 境外个人","question":"境外个人汇出账户内的外汇，超过5万美元，需要提供材料吗？\nDo non-resident individuals need documents to remit FX over USD 50,000 from their accounts?","keywords":["境外个人","超额度","材料","汇款"],"answer":"境外个人外汇储蓄账户资金汇出，凭本人有效身份证件办理，不受5万便利化额度限制。\nNon-residents can remit savings FX with valid ID only. This is not subject to the USD 50,000 convenience quota.","keyPoints":["核实客户身份信息","了解并确认真实业务用途","根据业务场景审核相关材料","如存在疑问，按现行制度进一步核实"],"materials":["有效身份证件","与业务用途相关的证明材料","其他根据实际业务需要提供的材料"],"showKeyPoints":false,"showMaterials":false,"relatedQuestions":[],"compliance":["本工具不直接判断客户风险等级","不得仅依据本工具作出业务准入或风险判断"],"source":"内部业务资料（Demo）","updateTime":"2026-09-20","status":"published"},{"id":"faq_020","category":"hk_macau_taiwan","categoryName":"港澳台 & 境外个人","question":"境外人士取得境内工资报酬，办理结汇需要什么资料？\nWhat documents are required for non-residents to settle wages earned in mainland China?","keywords":["境外个人","结售汇","材料","工资报酬"],"answer":"工资结汇不占用便利化额度，需提供雇佣合同、收入纳税证明等材料。\nWage FX settlement does not consume the convenience quota. Employment contract and tax certificate are required.","keyPoints":["核实客户身份信息","了解并确认真实业务用途","根据业务场景审核相关材料","如存在疑问，按现行制度进一步核实"],"materials":["有效身份证件","与业务用途相关的证明材料","其他根据实际业务需要提供的材料"],"showKeyPoints":false,"showMaterials":false,"relatedQuestions":[],"compliance":["本工具不直接判断客户风险等级","不得仅依据本工具作出业务准入或风险判断"],"source":"内部业务资料（Demo）","updateTime":"2026-09-20","status":"published"},{"id":"faq_021","category":"hk_macau_taiwan","categoryName":"港澳台 & 境外个人","question":"港澳居民来往内地通行证到期了，账户还能正常收汇吗？\nCan the account normally receive funds if the Mainland Travel Permit for Hong Kong and Macao residents expires?","keywords":["港澳台","证件","到期","收款"],"answer":"证件失效会触发账户管控，需要更新有效证件信息后，账户才可正常办理业务。\nExpired documents will trigger account control. Update valid ID information to resume banking services.","keyPoints":["核实客户身份信息","了解并确认真实业务用途","根据业务场景审核相关材料","如存在疑问，按现行制度进一步核实"],"materials":["有效身份证件","与业务用途相关的证明材料","其他根据实际业务需要提供的材料"],"showKeyPoints":false,"showMaterials":false,"relatedQuestions":[],"compliance":["本工具不直接判断客户风险等级","不得仅依据本工具作出业务准入或风险判断"],"source":"内部业务资料（Demo）","updateTime":"2026-09-20","status":"published"},{"id":"faq_022","category":"hk_macau_taiwan","categoryName":"港澳台 & 境外个人","question":"境外个人可以在境内购买房产并办理购付汇吗？\nCan non-residents purchase real estate in mainland China and handle FX purchase and remittance?","keywords":["境外个人","房产","购付汇"],"answer":"需满足不动产相关外汇管理政策，不属于便利化额度范围，需要提供全套背景材料。\nIt must comply with real estate FX policies, outside the convenience quota. Full set of supporting documents are required.","keyPoints":["核实客户身份信息","了解并确认真实业务用途","根据业务场景审核相关材料","如存在疑问，按现行制度进一步核实"],"materials":["有效身份证件","与业务用途相关的证明材料","其他根据实际业务需要提供的材料"],"showKeyPoints":false,"showMaterials":false,"relatedQuestions":[],"compliance":["本工具不直接判断客户风险等级","不得仅依据本工具作出业务准入或风险判断"],"source":"内部业务资料（Demo）","updateTime":"2026-09-20","status":"published"},{"id":"faq_023","category":"hk_macau_taiwan","categoryName":"港澳台 & 境外个人","question":"境外客户来网点，不懂中文，办理跨境业务怎么处理？\nHow to handle cross-border business for overseas customers who cannot speak Chinese?","keywords":["境外个人","语言障碍"],"answer":"启用双语服务手册、双语确认单，必要时联系翻译协助，保证客户知晓业务条款。\nUse bilingual service manuals and confirmation forms. Invite interpreters when needed to ensure customers understand terms.","keyPoints":["核实客户身份信息","了解并确认真实业务用途","根据业务场景审核相关材料","如存在疑问，按现行制度进一步核实"],"materials":["有效身份证件","与业务用途相关的证明材料","其他根据实际业务需要提供的材料"],"showKeyPoints":false,"showMaterials":false,"relatedQuestions":[],"compliance":["本工具不直接判断客户风险等级","不得仅依据本工具作出业务准入或风险判断"],"source":"内部业务资料（Demo）","updateTime":"2026-09-20","status":"published"},{"id":"faq_024","category":"cross_border_rmb","categoryName":"跨境人民币与合规风险","question":"什么是国际收支申报，哪些业务需要申报？\nQ: What is Balance of Payments Declaration, and which transactions require it?","keywords":["国际收支","申报"],"answer":"跨境资金收付，单笔等值5000美元以上，需要客户配合完成国际收支申报。\nCross-border fund receipts and payments equivalent to USD 5,000 or more per transaction require customer’s cooperation for declaration.","keyPoints":["核实客户身份信息","了解并确认真实业务用途","根据业务场景审核相关材料","如存在疑问，按现行制度进一步核实"],"materials":["有效身份证件","与业务用途相关的证明材料","其他根据实际业务需要提供的材料"],"showKeyPoints":false,"showMaterials":false,"relatedQuestions":[],"compliance":["本工具不直接判断客户风险等级","不得仅依据本工具作出业务准入或风险判断"],"source":"内部业务资料（Demo）","updateTime":"2026-09-20","status":"published"},{"id":"faq_025","category":"cross_border_rmb","categoryName":"跨境人民币与合规风险","question":"客户随便填写汇款用途，有没有风险？\nIs there any risk if customers fill in the remittance purpose arbitrarily?","keywords":["风险","汇款","用途"],"answer":"资金用途必须真实，虚假申报属于违规，会触发账户风控，影响后续跨境业务办理。\nFund purpose must be genuine. False declaration is a violation, triggering account risk control and affecting future cross-border services.","keyPoints":["核实客户身份信息","了解并确认真实业务用途","根据业务场景审核相关材料","如存在疑问，按现行制度进一步核实"],"materials":["有效身份证件","与业务用途相关的证明材料","其他根据实际业务需要提供的材料"],"showKeyPoints":false,"showMaterials":false,"relatedQuestions":[],"compliance":["本工具不直接判断客户风险等级","不得仅依据本工具作出业务准入或风险判断"],"source":"内部业务资料（Demo）","updateTime":"2026-09-20","status":"published"},{"id":"faq_026","category":"cross_border_rmb","categoryName":"跨境人民币与合规风险","question":"哪些国家/地区属于高风险地区，跨境汇款会加强审核？\nWhich countries or regions are high-risk with enhanced review for cross-border remittances?","keywords":["高风险地区","跨境汇款","审核"],"answer":"受反洗钱、制裁规则管控国家地区，汇款会加强尽调审核，部分地区无法办理汇出。\nCountries/regions under AML and sanction controls will face enhanced due diligence. Remittances to some areas are unavailable.","keyPoints":["核实客户身份信息","了解并确认真实业务用途","根据业务场景审核相关材料","如存在疑问，按现行制度进一步核实"],"materials":["有效身份证件","与业务用途相关的证明材料","其他根据实际业务需要提供的材料"],"showKeyPoints":false,"showMaterials":false,"relatedQuestions":[],"compliance":["本工具不直接判断客户风险等级","不得仅依据本工具作出业务准入或风险判断"],"source":"内部业务资料（Demo）","updateTime":"2026-09-20","status":"published"},{"id":"faq_027","category":"cross_border_rmb","categoryName":"跨境人民币与合规风险","question":"跨境人民币业务和外币跨境业务，外汇额度规则一样吗？\nDo cross-border RMB business and foreign currency cross-border business follow the same FX quota rules?","keywords":["跨境业务","规则"],"answer":"不一样，跨境人民币业务不占用个人5万美元便利化外汇额度。\nNo. Cross-border RMB transactions do not occupy the individual USD 50,000 FX convenience quota.","keyPoints":["核实客户身份信息","了解并确认真实业务用途","根据业务场景审核相关材料","如存在疑问，按现行制度进一步核实"],"materials":["有效身份证件","与业务用途相关的证明材料","其他根据实际业务需要提供的材料"],"showKeyPoints":false,"showMaterials":false,"relatedQuestions":[],"compliance":["本工具不直接判断客户风险等级","不得仅依据本工具作出业务准入或风险判断"],"source":"内部业务资料（Demo）","updateTime":"2026-09-20","status":"published"},{"id":"faq_028","category":"cross_border_rmb","categoryName":"跨境人民币与合规风险","question":"收到境外汇入款，银行打电话核实资金用途，是为什么？\nWhy does the bank call to verify fund purpose after receiving overseas incoming remittance?","keywords":["尽调","用途","核实"],"answer":"属于常态化反洗钱与外汇真实性审核，核实资金背景，保障账户安全。\nIt is routine AML and FX authenticity verification to confirm fund source and protect account security.","keyPoints":["核实客户身份信息","了解并确认真实业务用途","根据业务场景审核相关材料","如存在疑问，按现行制度进一步核实"],"materials":["有效身份证件","与业务用途相关的证明材料","其他根据实际业务需要提供的材料"],"showKeyPoints":false,"showMaterials":false,"relatedQuestions":[],"compliance":["本工具不直接判断客户风险等级","不得仅依据本工具作出业务准入或风险判断"],"source":"内部业务资料（Demo）","updateTime":"2026-09-20","status":"published"},{"id":"faq_029","category":"cross_border_rmb","categoryName":"跨境人民币与合规风险","question":"个人可以收境外公司给我汇的劳务费吗？\nCan individuals receive service fees remitted by overseas companies?","keywords":["劳务费","境外公司","汇款"],"answer":"可以，但不属于便利化额度，需要提供劳务合同、完税证明等交易背景材料。\nYes. But it is outside the convenience quota. Service contract and tax payment certificate are required as supporting documents.","keyPoints":["核实客户身份信息","了解并确认真实业务用途","根据业务场景审核相关材料","如存在疑问，按现行制度进一步核实"],"materials":["有效身份证件","与业务用途相关的证明材料","其他根据实际业务需要提供的材料"],"showKeyPoints":false,"showMaterials":false,"relatedQuestions":[],"compliance":["本工具不直接判断客户风险等级","不得仅依据本工具作出业务准入或风险判断"],"source":"内部业务资料（Demo）","updateTime":"2026-09-20","status":"published"},{"id":"faq_030","category":"cross_border_rmb","categoryName":"跨境人民币与合规风险","question":"办理跨境业务时有哪些常见合规风险？","keywords":["合规风险"],"answer":"Demo / Mock Data：办理前应核实客户身份及真实业务用途，并结合客户具体业务场景审核相关证明材料。实际办理口径以当前有效制度、监管要求及网点审核结果为准。","keyPoints":["核实客户身份信息","了解并确认真实业务用途","根据业务场景审核相关材料","如存在疑问，按现行制度进一步核实"],"materials":["有效身份证件","与业务用途相关的证明材料","其他根据实际业务需要提供的材料"],"showKeyPoints":true,"showMaterials":true,"relatedQuestions":[],"compliance":["本工具不直接判断客户风险等级","不得仅依据本工具作出业务准入或风险判断"],"source":"内部业务资料（Demo）","updateTime":"2026-09-20","status":"draft"},{"id":"faq_1789871319156","category":"hk_macau_taiwan","categoryName":"港澳台 & 境外个人","question":"港澳台居民跨境人民币收款，需要申报吗？\nDo Hong Kong, Macao and Taiwan residents need to declare for cross-border RMB receipts?","keywords":["港澳台","收款","申报","跨境人民币"],"answer":"达到申报标准的跨境人民币收支，同样需要按规定进行国际收支申报。\nCross-border RMB receipts and payments meeting the threshold shall go through balance of payments declaration as required.","keyPoints":[],"materials":[],"showKeyPoints":false,"showMaterials":false,"relatedQuestions":[],"compliance":["具体业务以现行制度和监管要求为准","工具不直接判断客户风险"],"source":"内部业务资料","updateTime":"2026-09-20","status":"published"}];

function header(){return `<header class='sticky top-0 z-20 bg-white/95 backdrop-blur border-b'><div class='max-w-6xl mx-auto px-4 h-16 flex items-center justify-between'><button onclick="go('home')" class='flex items-center gap-2 font-semibold text-slate-900'>${icon('landmark','w-6 h-6 text-blue-700')}<span class='leading-tight'>跨境业务助手<span class='block text-[10px] font-normal text-slate-500 tracking-wide'>Cross-Border Business Assistant</span></span></button><nav class='desktop-only flex gap-1 text-sm'><button onclick="go('home')" class='px-3 py-2 rounded-lg hover:bg-slate-100'><span class='leading-tight'>首页<span class='block text-[10px] font-normal text-slate-400'>Home</span></span></button><button onclick="go('all')" class='px-3 py-2 rounded-lg hover:bg-slate-100'><span class='leading-tight'>全部问题<span class='block text-[10px] font-normal text-slate-400'>All FAQs</span></span></button>${adminAuthed?`<button onclick="go('admin')" class='px-3 py-2 rounded-lg hover:bg-slate-100'><span class='leading-tight'>管理后台<span class='block text-[10px] font-normal text-slate-400'>Admin</span></span></button><button onclick="logoutAdmin()" class='px-3 py-2 rounded-lg text-slate-500 hover:bg-slate-100'>退出管理</button>`:`<button onclick="openAdminLogin()" class='px-3 py-2 rounded-lg text-slate-500 hover:bg-slate-100 flex items-center gap-1'>${icon('lock','w-4 h-4')} <span class='leading-tight'>管理员入口<span class='block text-[10px] font-normal text-slate-400'>Admin Login</span></span></button>`}</nav><button onclick="go('all')" class='md:hidden text-sm text-blue-700 font-medium'><span class='leading-tight'>全部问题<span class='block text-[10px] font-normal text-slate-400'>All FAQs</span></span></button></div></header>`}
function mobileBottom(){return `<nav class='mobile-bottom hidden fixed bottom-0 left-0 right-0 z-30 bg-white border-t px-4 pt-2 pb-[calc(.5rem+env(safe-area-inset-bottom))] justify-around shadow-lg'><button onclick="go('home')" class='flex flex-col items-center gap-1 text-xs ${state.page==='home'?'text-blue-700':'text-slate-500'}'>${icon('home','w-5 h-5')}首页</button><button onclick="go('all')" class='flex flex-col items-center gap-1 text-xs ${['all','list','detail'].includes(state.page)?'text-blue-700':'text-slate-500'}'>${icon('book-open','w-5 h-5')}全部问题</button><button onclick="document.getElementById('mainSearch')?.focus()||go('all')" class='flex flex-col items-center gap-1 text-xs text-slate-500'>${icon('search','w-5 h-5')}搜索</button></nav>`}
function notice(){return `<div class='rounded-xl border border-amber-200 bg-amber-50 p-4 text-sm text-amber-900 flex gap-3'>${icon('shield-check','w-5 h-5 shrink-0')}<span>本工具用于内部业务查询及培训参考，具体业务办理应以现行制度、监管要求及网点实际审核结果为准。<span class='block mt-1 text-xs opacity-75'>For internal reference and training only. Actual processing is subject to current policies, regulatory requirements and branch review.</span></span></div>`}
function searchBox(v=''){return `<div class='relative max-w-3xl mx-auto'><${'input'} id='mainSearch' value='${esc(v)}' onkeydown="if(event.key==='Enter') doSearch()" class='w-full h-14 rounded-2xl border border-slate-300 bg-white pl-12 pr-28 shadow-sm focus:ring-2 focus:ring-blue-500 outline-none' placeholder='请输入客户问题或业务关键词 / Search by question or keyword'><span class='absolute left-4 top-4 text-slate-400'>${icon('search')}</span><button onclick='doSearch()' class='absolute right-2 top-2 h-10 px-5 rounded-xl bg-blue-700 text-white hover:bg-blue-800'><span>搜索 <span class='text-xs opacity-80'>Search</span></span></button></div>`}
function home(){return `<main><section class='bg-gradient-to-b from-blue-50 to-slate-50'><div class='max-w-6xl mx-auto px-4 py-16 text-center'><div class='inline-flex items-center gap-2 text-blue-700 bg-blue-100 rounded-full px-3 py-1 text-sm mb-5'>${icon('globe','w-4 h-4')} <span>跨境业务服务支持 <span class='opacity-70'>· Cross-Border Service Support</span></span></div><h1 class='text-4xl md:text-5xl font-bold tracking-tight text-slate-950'>跨境业务助手<span class='block mt-2 text-xl md:text-2xl font-medium tracking-normal text-slate-500'>Cross-Border Business Assistant</span></h1><p class='mt-4 text-lg text-slate-600'>快速检索 · 标准回答 · 合规提示<span class='block mt-1 text-sm text-slate-400'>Quick Search · Standard Answers · Compliance Guidance</span></p><div class='mt-8'>${searchBox()}</div><div class='mt-4 flex flex-wrap justify-center gap-2 text-sm'>${['个人购汇','年度额度','留学汇款','赡家汇款','境外个人','港澳台','跨境人民币','尽职调查'].map(x=>`<button onclick="quick('${x}')" class='px-3 py-1.5 bg-white border rounded-full hover:border-blue-400 hover:text-blue-700'>${x}</button>`).join('')}</div></div></section><section class='max-w-6xl mx-auto px-4 py-10'><div class='flex justify-between items-end mb-5'><div><h2 class='text-2xl font-bold'>四大业务模块 <span class='block md:inline text-base font-medium text-slate-400 md:ml-2'>Four Key Business Modules</span></h2><p class='text-slate-500 mt-1'>按业务场景快速浏览高频问题 <span class='block text-sm text-slate-400'>Browse FAQs by business scenario</span></p></div><button onclick="go('all')" class='text-blue-700 text-sm font-medium'><span>查看全部问题 <span class='text-xs font-normal'>View All FAQs</span> →</span></button></div><div class='grid md:grid-cols-2 lg:grid-cols-4 gap-4'>${cats.map(c=>`<button onclick="openCat('${c[0]}')" class='text-left bg-white border rounded-2xl p-5 hover:shadow-md hover:border-blue-300 transition'><div class='w-11 h-11 rounded-xl bg-blue-50 text-blue-700 flex items-center justify-center mb-4'>${icon(c[3])}</div><h3 class='font-semibold text-lg'>${c[1]}</h3><p class='text-sm text-slate-500 mt-2 min-h-10'>${c[2]}</p><div class='mt-5 flex justify-between text-sm'><span class='text-slate-500'>${data.filter(f=>f.category===c[0]&&f.status==='published').length}个高频问题 <span class='text-[11px] text-slate-400'>FAQs</span></span><span class='text-blue-700'>进入模块 <span class='text-[11px]'>Explore</span> →</span></div></button>`).join('')}</div><div class='mt-8'>${notice()}</div></section></main>`}
function score(f,q){q=q.trim().toLowerCase(); if(!q)return 0; let s=0, title=f.question.toLowerCase(); if(title===q)s+=100;if(title.includes(q))s+=60;if(f.keywords.some(k=>k.toLowerCase().includes(q)||q.includes(k.toLowerCase())))s+=40;if(f.answer.toLowerCase().includes(q))s+=20;if(f.categoryName.toLowerCase().includes(q))s+=10; q.split(/\s+/).forEach(w=>{if(title.includes(w))s+=15; f.keywords.forEach(k=>{if(k.includes(w))s+=10})});return s}
function card(f){return `<button onclick="detail('${f.id}')" class='w-full text-left bg-white border rounded-xl p-5 hover:border-blue-300 hover:shadow-sm'><div class='flex gap-3 justify-between'><div><div class='text-xs text-blue-700 font-medium mb-2'>${f.categoryName}</div><h3 class='font-semibold text-lg whitespace-pre-line'>${esc(f.question)}</h3><div class='mt-3 flex flex-wrap gap-1'>${f.keywords.map(k=>`<span class='text-xs px-2 py-1 bg-slate-100 rounded-md'>${esc(k)}</span>`).join('')}</div><p class='text-sm text-slate-500 mt-3 whitespace-pre-line line-clamp-4'>${esc(f.answer)}</p></div><span class='text-blue-700 shrink-0'>${icon('chevron-right')}</span></div></button>`}
function listPage(){let arr=data.filter(f=>f.status==='published');if(state.cat!=='all')arr=arr.filter(f=>f.category===state.cat);if(state.query)arr=arr.map(f=>[f,score(f,state.query)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);return `<main class='max-w-5xl mx-auto px-4 py-10'><button onclick="go('home')" class='text-sm text-slate-500 flex gap-1 mb-5'>${icon('arrow-left','w-4 h-4')} 返回首页</button><h1 class='text-3xl font-bold'>${state.query?'搜索结果':'全部问题'}</h1>${state.query?`<p class='text-slate-500 mt-2'>关键词“${esc(state.query)}”，共找到 ${arr.length} 条相关问题</p>`:`<p class='text-slate-500 mt-2'>按模块浏览或搜索跨境业务高频问题</p>`}<div class='mt-6'>${searchBox(state.query)}</div><div class='mt-6 flex gap-2 flex-wrap'>${[['all','全部'],...cats.map(c=>[c[0],c[1]])].map(c=>`<button onclick="filterCat('${c[0]}')" class='px-3 py-2 rounded-lg text-sm ${state.cat===c[0]?'bg-blue-700 text-white':'bg-white border'}'>${c[1]}</button>`).join('')}</div><div class='mt-6 grid gap-3'>${arr.length?arr.map(card).join(''):`<div class='bg-white border rounded-2xl py-16 text-center'>${icon('search','w-10 h-10 mx-auto text-slate-300')}<h3 class='mt-4 font-semibold'>暂未找到相关问题</h3><p class='text-slate-500 text-sm mt-2'>可以尝试更换关键词，例如：购汇、额度、留学、汇款、境外个人、跨境人民币等。</p></div>`}</div></main>`}
function detailPage(){let f=data.find(x=>x.id===state.detail);if(!f)return listPage();let rel=(f.relatedQuestions?.length?f.relatedQuestions.map(id=>data.find(x=>x.id===id)).filter(x=>x&&x.status==='published'):data.filter(x=>x.category===f.category&&x.id!==f.id&&x.status==='published').slice(0,4));return `<main class='max-w-4xl mx-auto px-4 py-10'><button onclick='history.back();go("all")' class='text-sm text-slate-500 flex gap-1 mb-5'>${icon('arrow-left','w-4 h-4')} 返回问题列表</button><div class='text-sm text-blue-700 font-medium'>${f.categoryName}</div><h1 class='text-3xl font-bold mt-2 whitespace-pre-line leading-relaxed'>${esc(f.question)}</h1><div class='mt-6 bg-blue-50 border border-blue-200 rounded-2xl p-6'><div class='flex justify-between gap-4'><h2 class='font-bold text-blue-950'>标准回答</h2><button onclick="copyAns('${f.id}')" class='text-sm text-blue-700 flex gap-1'>${icon('copy','w-4 h-4')} 复制标准回答</button></div><div class='mt-3 leading-7 whitespace-pre-line'>${esc(f.answer)}</div></div>${((f.showKeyPoints!==false&&f.keyPoints?.length)||(f.showMaterials!==false&&f.materials?.length))?`<div class='grid md:grid-cols-2 gap-4 mt-4'>${f.showKeyPoints!==false&&f.keyPoints?.length?`<section class='bg-white border rounded-2xl p-5'><h2 class='font-bold'>办理要点</h2><ul class='mt-3 space-y-2 text-sm'>${f.keyPoints.map(x=>`<li class='flex gap-2'>✓ <span>${esc(x)}</span></li>`).join('')}</ul></section>`:''}${f.showMaterials!==false&&f.materials?.length?`<section class='bg-white border rounded-2xl p-5'><h2 class='font-bold'>所需材料</h2><ul class='mt-3 space-y-2 text-sm'>${f.materials.map(x=>`<li class='flex gap-2'>□ <span>${esc(x)}</span></li>`).join('')}</ul></section>`:''}</div>`:''}<section class='mt-4 rounded-2xl border border-amber-200 bg-amber-50 p-5'><h2 class='font-bold text-amber-900'>合规提示</h2><ul class='mt-3 space-y-2 text-sm text-amber-900'>${f.compliance.map(x=>`<li>• ${esc(x)}</li>`).join('')}</ul></section><div class='mt-4 bg-white border rounded-2xl p-5 text-sm'><div><b>来源：</b>${esc(f.source)}</div><div class='mt-2'><b>更新时间：</b>${f.updateTime}</div></div><section class='mt-8'><h2 class='font-bold text-xl mb-3'>相关问题</h2><div class='grid gap-2'>${rel.map(card).join('')}</div></section><div class='mt-8'>${notice()}</div></main>`}
function admin(){let arr=data.filter(f=>(state.adminCat==='all'||f.category===state.adminCat)&&(!state.adminQuery||f.question.includes(state.adminQuery)||f.keywords.join(' ').includes(state.adminQuery)));return `<main class='max-w-6xl mx-auto px-4 py-10'><div class='flex flex-col md:flex-row md:justify-between md:items-center gap-4'><div><h1 class='text-3xl font-bold'>FAQ 管理</h1><p class='text-slate-500 mt-1'>维护跨境业务知识库 · 当前 ${data.length} 条</p></div><div class='flex flex-wrap gap-2'><button onclick='openDataManager()' class='border bg-white rounded-xl px-4 py-2 flex items-center gap-2'>${icon('database','w-4 h-4')} 数据管理</button><button onclick='openChangePassword()' class='border bg-white rounded-xl px-4 py-2 flex items-center gap-2'>${icon('key-round','w-4 h-4')} 修改密码</button><button onclick='editFaq()' class='bg-blue-700 text-white rounded-xl px-4 py-2 flex gap-2'>${icon('plus')} 新增 FAQ</button></div></div><div class='mt-6 bg-white border rounded-xl p-4 flex flex-col md:flex-row gap-3'><input id='aq' value='${esc(state.adminQuery)}' placeholder='搜索问题或关键词' class='border rounded-lg px-3 py-2 flex-1'><select id='ac' class='border rounded-lg px-3 py-2'><option value='all'>全部模块</option>${cats.map(c=>`<option value='${c[0]}' ${state.adminCat===c[0]?'selected':''}>${c[1]}</option>`).join('')}</select><button onclick='adminFilter()' class='border rounded-lg px-4 py-2'>筛选</button></div><div class='mt-4 grid gap-2'>${arr.map((f,i)=>`<div class='bg-white border rounded-xl p-4 flex flex-col md:flex-row md:items-center gap-3'><div class='text-sm text-slate-400 w-10'>${String(i+1).padStart(2,'0')}</div><div class='flex-1'><div class='font-medium whitespace-pre-line'>${esc(f.question)}</div><div class='text-xs text-slate-500 mt-1'>${f.categoryName} · ${f.updateTime}</div></div><span class='text-xs px-2 py-1 rounded-full ${f.status==='published'?'bg-emerald-50 text-emerald-700':'bg-slate-100'}'>${f.status==='published'?'已发布':'已下线'}</span><div class='flex gap-2'><button onclick="toggle('${f.id}')" class='border rounded-lg px-3 py-1.5 text-sm'>${f.status==='published'?'下线':'发布'}</button><button onclick="editFaq('${f.id}')" class='border rounded-lg px-3 py-1.5 text-sm'>编辑</button><button onclick="delFaq('${f.id}')" class='border border-red-200 text-red-600 rounded-lg px-3 py-1.5 text-sm'>删除</button></div></div>`).join('')}</div></main>`}
function editor(){let f=state.editing?data.find(x=>x.id===state.editing):null;let kp=(f?.keyPoints||[]).join('\n'),mt=(f?.materials||[]).join('\n'),rq=(f?.relatedQuestions||[]);return `<main class='max-w-3xl mx-auto px-4 py-10'><button onclick="go('admin')" class='text-sm text-slate-500 flex gap-1 mb-5'>${icon('arrow-left','w-4 h-4')} 返回<span class='leading-tight'>管理后台<span class='block text-[10px] font-normal text-slate-400'>Admin</span></span></button><h1 class='text-3xl font-bold'>${f?'编辑 FAQ':'新增 FAQ'}</h1><form onsubmit='saveFaq(event)' class='mt-6 bg-white border rounded-2xl p-6 space-y-5'><label class='block'><span class='text-sm font-medium'>问题标题</span><span class='block text-xs text-slate-500 mt-1'>支持换行，可用于中英文分行展示</span><textarea id='fq' required rows='3' class='mt-1 w-full border rounded-lg px-3 py-2' placeholder='例如：\n个人年度便利化额度是多少？\nWhat is the annual facilitation quota?'>${esc(f?.question||'')}</textarea></label><label class='block'><span class='text-sm font-medium'>所属模块</span><select id='fc' class='mt-1 w-full border rounded-lg px-3 py-2'>${cats.map(c=>`<option value='${c[0]}' ${f?.category===c[0]?'selected':''}>${c[1]}</option>`).join('')}</select></label><label class='block'><span class='text-sm font-medium'>关键词（逗号分隔）</span><input id='fk' value='${esc(f?.keywords?.join(',')||'')}' class='mt-1 w-full border rounded-lg px-3 py-2'></label><label class='block'><span class='text-sm font-medium'>标准回答</span><span class='block text-xs text-slate-500 mt-1'>支持多行输入，前台会按原换行格式展示，适合中英文对照</span><textarea id='fa' rows='8' class='mt-1 w-full border rounded-lg px-3 py-2' placeholder='中文回答……\nEnglish answer...'>${esc(f?.answer||demoAnswer)}</textarea></label><div class='border rounded-xl p-4'><div class='flex items-center justify-between gap-4'><div><div class='font-medium'>办理要点</div><div class='text-xs text-slate-500 mt-1'>每行填写一条；可控制前台是否显示</div></div><label class='flex items-center gap-2 text-sm'><input id='fshowkp' type='checkbox' ${f?.showKeyPoints===false?'':'checked'}> 前台显示</label></div><textarea id='fkp' rows='4' class='mt-3 w-full border rounded-lg px-3 py-2' placeholder='每行一条办理要点'>${esc(kp)}</textarea></div><div class='border rounded-xl p-4'><div class='flex items-center justify-between gap-4'><div><div class='font-medium'>所需材料</div><div class='text-xs text-slate-500 mt-1'>每行填写一项；可控制前台是否显示</div></div><label class='flex items-center gap-2 text-sm'><input id='fshowmt' type='checkbox' ${f?.showMaterials===false?'':'checked'}> 前台显示</label></div><textarea id='fmt' rows='4' class='mt-3 w-full border rounded-lg px-3 py-2' placeholder='每行一项所需材料'>${esc(mt)}</textarea></div><div class='border rounded-xl p-4'><div class='font-medium'>相关问题</div><div class='text-xs text-slate-500 mt-1 mb-3'>可多选；不选择时自动推荐同模块问题</div><div class='max-h-56 overflow-auto grid gap-2'>${data.filter(x=>x.id!==f?.id).map(x=>`<label class='flex gap-2 items-start text-sm'><input type='checkbox' name='relatedFaq' value='${x.id}' ${rq.includes(x.id)?'checked':''}><span class='whitespace-pre-line'>${esc(x.question)} <span class='text-slate-400'>· ${x.categoryName}</span></span></label>`).join('')}</div></div><label class='block'><span class='text-sm font-medium'>状态</span><select id='fs' class='mt-1 w-full border rounded-lg px-3 py-2'><option value='published' ${f?.status!=='draft'?'selected':''}>发布</option><option value='draft' ${f?.status==='draft'?'selected':''}>下线</option></select></label><div class='flex justify-end gap-2'><button type='button' onclick="go('admin')" class='border rounded-lg px-4 py-2'>取消</button><button class='bg-blue-700 text-white rounded-lg px-5 py-2'>保存</button></div></form></main>`}
function render(){if((state.page==='admin'||state.page==='edit')&&!adminAuthed){state.page='home'}let body=state.page==='home'?home():state.page==='detail'?detailPage():state.page==='admin'?admin():state.page==='edit'?editor():listPage();document.getElementById('app').innerHTML=header()+body+mobileBottom()+`<div id='toast' class='fixed bottom-20 md:bottom-5 right-4 md:right-5 hidden bg-slate-900 text-white px-4 py-3 rounded-xl shadow-lg text-sm'></div>`;lucide.createIcons()}

function openAdminLogin(){
  const wrap=document.createElement('div');wrap.id='adminLoginModal';wrap.className='fixed inset-0 z-50 bg-slate-900/40 flex items-center justify-center p-4';
  wrap.innerHTML=`<div class='bg-white rounded-2xl shadow-xl w-full max-w-md p-6'><div class='flex items-center gap-3 mb-5'><div class='w-10 h-10 rounded-xl bg-blue-50 text-blue-700 flex items-center justify-center'>${icon('lock','w-5 h-5')}</div><div><h2 class='text-xl font-bold'>管理员验证</h2><p class='text-sm text-slate-500'>管理后台仅限授权人员使用</p></div></div><label class='block text-sm font-medium'>管理员账号<input id='adminUser' class='mt-1 w-full border rounded-lg px-3 py-2' placeholder='请输入管理员账号'></label><label class='block text-sm font-medium mt-4'>访问密码<input id='adminPass' type='password' class='mt-1 w-full border rounded-lg px-3 py-2' placeholder='请输入访问密码' onkeydown="if(event.key==='Enter')adminLogin()"></label><p id='adminErr' class='hidden text-sm text-red-600 mt-3'>账号或密码不正确</p><div class='flex justify-end gap-2 mt-6'><button onclick="document.getElementById('adminLoginModal').remove()" class='border rounded-lg px-4 py-2'>取消</button><button onclick='adminLogin()' class='bg-blue-700 text-white rounded-lg px-5 py-2'>验证并进入</button></div><p class='text-xs text-slate-400 mt-4'>演示版采用前端访问控制；正式上线时应接入银行统一身份认证和后台权限系统。</p></div>`;
  document.body.appendChild(wrap);lucide.createIcons();setTimeout(()=>document.getElementById('adminUser')?.focus(),0);
}
function adminLogin(){const u=document.getElementById('adminUser').value.trim(),p=document.getElementById('adminPass').value;if(u==='admin'&&p===getAdminPassword()){adminAuthed=true;sessionStorage.setItem('crossborder_admin_auth','1');document.getElementById('adminLoginModal')?.remove();state.page='admin';render();toast('管理员验证成功')}else document.getElementById('adminErr').classList.remove('hidden')}


function openDataManager(){
  if(!adminAuthed){openAdminLogin();return}
  const wrap=document.createElement('div');wrap.id='dataManagerModal';wrap.className='fixed inset-0 z-50 bg-slate-900/40 flex items-center justify-center p-4 overflow-auto';
  wrap.innerHTML=`<div class='bg-white rounded-2xl shadow-xl w-full max-w-2xl p-6 my-6'><div class='flex justify-between gap-4'><div><h2 class='text-xl font-bold'>数据管理与发布</h2><p class='text-sm text-slate-500 mt-1'>把本机维护的数据导出、备份，或直接生成可推送 GitHub Pages 的新版 index.html。</p></div><button onclick="document.getElementById('dataManagerModal').remove()" class='text-slate-400'>${icon('x')}</button></div><div class='grid sm:grid-cols-3 gap-3 mt-5'><div class='border rounded-xl p-4'><div class='text-xs text-slate-500'>当前数据版本</div><div class='font-semibold mt-1'>${currentDataVersion}</div></div><div class='border rounded-xl p-4'><div class='text-xs text-slate-500'>FAQ 总数</div><div class='font-semibold mt-1'>${data.length}</div></div><div class='border rounded-xl p-4'><div class='text-xs text-slate-500'>已发布</div><div class='font-semibold mt-1'>${data.filter(x=>x.status==='published').length}</div></div></div><div class='mt-5 border rounded-xl p-4'><label class='text-sm font-medium'>下一发布版本号</label><input id='publishVersion' value='${nextVersion(currentDataVersion)}' class='mt-2 w-full border rounded-lg px-3 py-2'><p class='text-xs text-slate-500 mt-2'>生成发布版时，这个版本会写入 HTML。访问者本地版本更旧时，会自动更新到发布版数据。</p></div><div class='mt-5 grid sm:grid-cols-2 gap-3'><button onclick='exportData()' class='border rounded-xl p-4 text-left hover:border-blue-300'><b>导出 JSON</b><div class='text-xs text-slate-500 mt-1'>备份当前 FAQ 数据</div></button><label class='border rounded-xl p-4 text-left hover:border-blue-300 cursor-pointer'><b>导入 JSON</b><div class='text-xs text-slate-500 mt-1'>恢复或导入其他 FAQ 数据</div><input type='file' accept='.json,application/json' class='hidden' onchange='importData(event)'></label><button onclick='generateRelease()' class='sm:col-span-2 bg-blue-700 text-white rounded-xl p-4 text-left hover:bg-blue-800'><b>生成发布版 index.html</b><div class='text-xs text-blue-100 mt-1'>将当前 FAQ 写入新的单文件 H5，下载后可直接替换 GitHub 仓库中的 index.html</div></button></div><div class='mt-5 rounded-xl bg-amber-50 border border-amber-200 p-4 text-sm text-amber-900'>建议流程：后台维护 → 预览 → 导出 JSON 备份 → 生成发布版 → 将下载的 index.html 推送到 GitHub → GitHub Pages 自动更新。</div></div>`;
  document.body.appendChild(wrap);lucide.createIcons();
}
function nextVersion(v){let m=v.match(/^(.*?)(\d+)$/);if(!m)return new Date().toISOString().slice(0,10).replaceAll('-','.')+'.01';return m[1]+String(Number(m[2])+1).padStart(m[2].length,'0')}
function downloadBlob(content,name,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function exportData(){const pack={product:'跨境业务助手',version:currentDataVersion,exportedAt:new Date().toISOString(),faqs:data};downloadBlob(JSON.stringify(pack,null,2),'跨境业务助手_FAQ_'+currentDataVersion+'.json','application/json;charset=utf-8');toast('数据已导出')}
function importData(event){const file=event.target.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const obj=JSON.parse(reader.result);const arr=Array.isArray(obj)?obj:obj.faqs;if(!Array.isArray(arr))throw new Error();if(!confirm(`将导入 ${arr.length} 条 FAQ，并覆盖当前本地数据，是否继续？`))return;data=arr;currentDataVersion=(obj.version||nextVersion(currentDataVersion));save();document.getElementById('dataManagerModal')?.remove();render();toast('数据导入成功')}catch(e){alert('JSON 文件格式不正确')}};reader.readAsText(file)}
function generateRelease(){
  const version=document.getElementById('publishVersion').value.trim();
  if(!version){alert('请输入发布版本号');return}
  // 使用 DOM 克隆生成干净发布版：不把当前的管理后台、数据管理弹窗、登录框等运行时界面写入 index.html。
  const clone=document.documentElement.cloneNode(true);
  ['dataManagerModal','adminLoginModal','changePasswordModal'].forEach(id=>clone.querySelector('#'+id)?.remove());
  const appClone=clone.querySelector('#app');
  if(appClone) appClone.innerHTML='';
  let html='<!doctype html>\n'+clone.outerHTML;
  // 将当前浏览器中已经维护好的 FAQ 数据真正固化进发布版 HTML。
  // 同时兼容旧版 `let defaults=qs.map(...)` 和当前版 `let defaults=[...]` 两种结构。
  const defaultsCode='let defaults='+JSON.stringify(data).replace(/<\/script/gi,'<\\/script')+';';
  const defaultsStart=html.indexOf('let defaults=');
  const storageKeyStart=html.indexOf("const FAQ_STORAGE_KEY=",defaultsStart);
  if(defaultsStart===-1||storageKeyStart===-1){
    alert('生成失败：未找到内置 FAQ 数据区域，请使用原始管理版 HTML 重试。');
    return;
  }
  html=html.slice(0,defaultsStart)+defaultsCode+'\n'+html.slice(storageKeyStart);
  html=html.replace(/const EMBEDDED_DATA_VERSION='[^']*';/,`const EMBEDDED_DATA_VERSION='${version}';`);
  // 发布版每次加载都从首页开始；管理后台仍可通过管理员入口进入，但不会作为发布后的初始页面。
  html=html.replace(/let state=\{page:'[^']*',query:/,"let state={page:'home',query:");
  downloadBlob(html,'index.html','text/html;charset=utf-8');
  currentDataVersion=version;
  localStorage.setItem(VERSION_STORAGE_KEY,version);
  toast('发布版 index.html 已生成；打开后将直接进入首页')
}

function openChangePassword(){
  if(!adminAuthed){openAdminLogin();return}
  const wrap=document.createElement('div');wrap.id='changePasswordModal';wrap.className='fixed inset-0 z-50 bg-slate-900/40 flex items-center justify-center p-4';
  wrap.innerHTML=`<div class='bg-white rounded-2xl shadow-xl w-full max-w-md p-6'><div class='flex items-center gap-3 mb-5'><div class='w-10 h-10 rounded-xl bg-blue-50 text-blue-700 flex items-center justify-center'>${icon('key-round','w-5 h-5')}</div><div><h2 class='text-xl font-bold'>修改管理员密码</h2><p class='text-sm text-slate-500'>修改后，下次进入管理后台需使用新密码</p></div></div><label class='block text-sm font-medium'>当前密码<input id='oldAdminPass' type='password' class='mt-1 w-full border rounded-lg px-3 py-2' placeholder='请输入当前密码'></label><label class='block text-sm font-medium mt-4'>新密码<input id='newAdminPass' type='password' class='mt-1 w-full border rounded-lg px-3 py-2' placeholder='至少8位'></label><label class='block text-sm font-medium mt-4'>确认新密码<input id='confirmAdminPass' type='password' class='mt-1 w-full border rounded-lg px-3 py-2' placeholder='再次输入新密码' onkeydown="if(event.key==='Enter')changeAdminPassword()"></label><p id='passwordErr' class='hidden text-sm text-red-600 mt-3'></p><div class='flex justify-end gap-2 mt-6'><button onclick="document.getElementById('changePasswordModal').remove()" class='border rounded-lg px-4 py-2'>取消</button><button onclick='changeAdminPassword()' class='bg-blue-700 text-white rounded-lg px-5 py-2'>确认修改</button></div><p class='text-xs text-slate-400 mt-4'>演示版密码保存在当前浏览器本地。正式上线应由银行统一身份认证或服务端安全管理密码。</p></div>`;
  document.body.appendChild(wrap);lucide.createIcons();setTimeout(()=>document.getElementById('oldAdminPass')?.focus(),0);
}
function changeAdminPassword(){
  const oldP=document.getElementById('oldAdminPass').value;
  const newP=document.getElementById('newAdminPass').value;
  const confirmP=document.getElementById('confirmAdminPass').value;
  const err=document.getElementById('passwordErr');
  const fail=m=>{err.textContent=m;err.classList.remove('hidden')};
  if(oldP!==getAdminPassword()) return fail('当前密码不正确');
  if(newP.length<8) return fail('新密码至少需要8位');
  if(newP===oldP) return fail('新密码不能与当前密码相同');
  if(newP!==confirmP) return fail('两次输入的新密码不一致');
  localStorage.setItem(ADMIN_PASSWORD_KEY,newP);
  document.getElementById('changePasswordModal')?.remove();
  toast('管理员密码修改成功');
}

function logoutAdmin(){adminAuthed=false;sessionStorage.removeItem('crossborder_admin_auth');state.page='home';render();toast('已退出管理后台')}

function go(p){if((p==='admin'||p==='edit')&&!adminAuthed){openAdminLogin();return}state.page=p;if(p==='all'){state.query='';state.cat='all'}render();scrollTo(0,0)}function doSearch(){state.query=document.getElementById('mainSearch').value.trim();state.cat='all';state.page='list';render()}function quick(q){state.query=q;state.cat='all';state.page='list';render()}function filterCat(c){state.cat=c;render()}function openCat(c){state.cat=c;state.query='';state.page='list';render()}function detail(id){state.detail=id;state.page='detail';render();scrollTo(0,0)}function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),1800)}function copyAns(id){navigator.clipboard.writeText(data.find(x=>x.id===id).answer);toast('已复制标准回答')}function adminFilter(){state.adminQuery=document.getElementById('aq').value;state.adminCat=document.getElementById('ac').value;render()}function toggle(id){let f=data.find(x=>x.id===id);f.status=f.status==='published'?'draft':'published';save();render();toast(f.status==='published'?'已发布':'已下线')}function delFaq(id){if(confirm('确定删除该问题吗？')){data=data.filter(x=>x.id!==id);save();render();toast('删除成功')}}function editFaq(id=null){state.editing=id;state.page='edit';render()}function saveFaq(e){e.preventDefault();let cat=document.getElementById('fc').value,c=cats.find(x=>x[0]===cat);let old=state.editing?data.find(x=>x.id===state.editing):null;let lines=id=>document.getElementById(id).value.split(/\n/).map(x=>x.trim()).filter(Boolean);let obj={id:state.editing||'faq_'+Date.now(),category:cat,categoryName:c[1],question:document.getElementById('fq').value,keywords:document.getElementById('fk').value.split(/[,，]/).map(x=>x.trim()).filter(Boolean),answer:document.getElementById('fa').value,keyPoints:lines('fkp'),materials:lines('fmt'),showKeyPoints:document.getElementById('fshowkp').checked,showMaterials:document.getElementById('fshowmt').checked,relatedQuestions:[...document.querySelectorAll("input[name='relatedFaq']:checked")].map(x=>x.value),compliance:old?.compliance||['具体业务以现行制度和监管要求为准','工具不直接判断客户风险'],source:old?.source||'内部业务资料',updateTime:new Date().toISOString().slice(0,10),status:document.getElementById('fs').value};if(state.editing){data=data.map(x=>x.id===state.editing?obj:x)}else data.push(obj);save();state.page='admin';state.editing=null;render();toast('保存成功')}
render();
</script>
