const cats=[['personal_fx','个人结售汇','了解个人购汇、结汇及额度相关业务',8,'credit-card'],['study_support','留学 / 赡家汇款','了解留学缴费、生活费及赡家汇款',8,'plane'],['hk_macau_taiwan','港澳台 & 境外个人','了解港澳台居民及境外个人业务',7,'globe'],['cross_border_rmb','跨境人民币与合规风险','了解跨境人民币及常见合规风险',7,'shield-check']];
const qs=[['personal_fx','个人年度便利化额度是多少？',['年度额度','购汇额度','便利化额度']],['personal_fx','哪些情况可以办理个人购汇？',['个人购汇','用途']],['personal_fx','购汇是否必须本人办理？',['代办','本人']],['personal_fx','个人购汇需要提供哪些材料？',['购汇','材料']],['personal_fx','境内个人如何办理结汇？',['结汇']],['personal_fx','未成年人办理个人结售汇有什么要求？',['未成年人']],['personal_fx','超过年度便利化额度后如何办理？',['超额度']],['personal_fx','个人购汇资金可以用于哪些用途？',['购汇用途']],['study_support','留学缴费汇款需要什么材料？',['留学','学费','材料']],['study_support','给境外子女汇生活费需要什么材料？',['生活费','留学']],['study_support','境内个人向境外汇款有什么要求？',['境外汇款']],['study_support','留学学费汇款如何办理？',['留学','学费']],['study_support','赡家款如何办理？',['赡家','汇款']],['study_support','境外学校账户与个人账户收款有什么区别？',['学校账户','收款']],['study_support','汇款用途如何填写？',['汇款用途']],['study_support','大额留学汇款需要注意什么？',['大额','留学']],['hk_macau_taiwan','港澳居民来内地办理业务需要什么证件？',['港澳','证件']],['hk_macau_taiwan','台湾居民来大陆办理业务需要什么证件？',['台湾','证件']],['hk_macau_taiwan','境外个人可以办理人民币结算吗？',['境外个人','人民币']],['hk_macau_taiwan','境外个人可以办理结售汇吗？',['境外个人','结售汇']],['hk_macau_taiwan','境外个人办理购汇有哪些要求？',['境外个人','购汇']],['hk_macau_taiwan','港澳台居民个人账户办理业务有哪些注意事项？',['港澳台','账户']],['hk_macau_taiwan','境外个人办理人民币汇款有什么要求？',['境外个人','人民币汇款']],['cross_border_rmb','什么是跨境人民币业务？',['跨境人民币']],['cross_border_rmb','个人跨境人民币汇款有哪些要求？',['跨境人民币','汇款']],['cross_border_rmb','跨境业务为什么需要进行身份识别？',['身份识别','合规']],['cross_border_rmb','为什么银行会要求客户补充交易材料？',['补充材料','合规']],['cross_border_rmb','客户无法提供材料怎么办？',['材料','尽调']],['cross_border_rmb','什么情况下可能需要进一步开展尽职调查？',['尽职调查']],['cross_border_rmb','办理跨境业务时有哪些常见合规风险？',['合规风险']]];

let defaults=qs.map((q,i)=>({id:'faq_'+String(i+1).padStart(3,'0'),category:q[0],categoryName:cats.find(c=>c[0]===q[0])[1],question:q[1],keywords:q[2],answer:demoAnswer,keyPoints:['核实客户身份信息','了解并确认真实业务用途','根据业务场景审核相关材料','如存在疑问，按现行制度进一步核实'],materials:['有效身份证件','与业务用途相关的证明材料','其他根据实际业务需要提供的材料'],compliance:['本工具不直接判断客户风险等级','不得仅依据本工具作出业务准入或风险判断'],source:'内部业务资料（Demo）',updateTime:'2026-09-19',status:'published'}));
let data=JSON.parse(localStorage.getItem('apec_faqs')||'null')||defaults; const save=()=>localStorage.setItem('apec_faqs',JSON.stringify(data));
let state={page:'home',query:'',cat:'all',detail:null,adminQuery:'',adminCat:'all',editing:null};
let adminAuthed=sessionStorage.getItem('crossborder_admin_auth')==='1';
const ADMIN_PASSWORD_KEY='crossborder_admin_password';
const getAdminPassword=()=>localStorage.getItem(ADMIN_PASSWORD_KEY)||'CrossBorder2026';
const esc=s=>(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function icon(n,cls='w-5 h-5'){return `<i data-lucide='${n}' class='${cls}'></i>`}
function header(){return `<header class='sticky top-0 z-20 bg-white/95 backdrop-blur border-b'><div class='max-w-6xl mx-auto px-4 h-16 flex items-center justify-between'><button onclick="go('home')" class='flex items-center gap-2 font-semibold text-slate-900'>${icon('landmark','w-6 h-6 text-blue-700')}<span>跨境业务助手</span></button><nav class='desktop-only flex gap-1 text-sm'><button onclick="go('home')" class='px-3 py-2 rounded-lg hover:bg-slate-100'>首页</button><button onclick="go('all')" class='px-3 py-2 rounded-lg hover:bg-slate-100'>全部问题</button>${adminAuthed?`<button onclick="go('admin')" class='px-3 py-2 rounded-lg hover:bg-slate-100'>管理后台</button><button onclick="logoutAdmin()" class='px-3 py-2 rounded-lg text-slate-500 hover:bg-slate-100'>退出管理</button>`:`<button onclick="openAdminLogin()" class='px-3 py-2 rounded-lg text-slate-500 hover:bg-slate-100 flex items-center gap-1'>${icon('lock','w-4 h-4')} 管理员入口</button>`}</nav><button onclick="go('all')" class='md:hidden text-sm text-blue-700 font-medium'>全部问题</button></div></header>`}

function notice(){return `<div class='rounded-xl border border-amber-200 bg-amber-50 p-4 text-sm text-amber-900 flex gap-3'>${icon('shield-check','w-5 h-5 shrink-0')}<span>本工具用于内部业务查询及培训参考，具体业务办理应以现行制度、监管要求及网点实际审核结果为准。</span></div>`}
function searchBox(v=''){return `<div class='relative max-w-3xl mx-auto'><${'input'} id='mainSearch' value='${esc(v)}' onkeydown="if(event.key==='Enter') doSearch()" class='w-full h-14 rounded-2xl border border-slate-300 bg-white pl-12 pr-28 shadow-sm focus:ring-2 focus:ring-blue-500 outline-none' placeholder='请输入客户问题、业务关键词，例如：留学汇款、年度额度、境外个人……'><span class='absolute left-4 top-4 text-slate-400'>${icon('search')}</span><button onclick='doSearch()' class='absolute right-2 top-2 h-10 px-5 rounded-xl bg-blue-700 text-white hover:bg-blue-800'>搜索</button></div>`}
function home(){return `<main><section class='bg-gradient-to-b from-blue-50 to-slate-50'><div class='max-w-6xl mx-auto px-4 py-16 text-center'><div class='inline-flex items-center gap-2 text-blue-700 bg-blue-100 rounded-full px-3 py-1 text-sm mb-5'>${icon('globe','w-4 h-4')} 跨境业务服务支持</div><h1 class='text-4xl md:text-5xl font-bold tracking-tight text-slate-950'>跨境业务助手</h1><p class='mt-4 text-lg text-slate-600'>快速检索 · 标准回答 · 合规提示</p><div class='mt-8'>${searchBox()}</div><div class='mt-4 flex flex-wrap justify-center gap-2 text-sm'>${['个人购汇','年度额度','留学汇款','赡家汇款','境外个人','港澳台','跨境人民币','尽职调查'].map(x=>`<button onclick="quick('${x}')" class='px-3 py-1.5 bg-white border rounded-full hover:border-blue-400 hover:text-blue-700'>${x}</button>`).join('')}</div></div></section><section class='max-w-6xl mx-auto px-4 py-10'><div class='flex justify-between items-end mb-5'><div><h2 class='text-2xl font-bold'>四大业务模块</h2><p class='text-slate-500 mt-1'>按业务场景快速浏览高频问题</p></div><button onclick="go('all')" class='text-blue-700 text-sm font-medium'>查看全部问题 →</button></div><div class='grid md:grid-cols-2 lg:grid-cols-4 gap-4'>${cats.map(c=>`<button onclick="openCat('${c[0]}')" class='text-left bg-white border rounded-2xl p-5 hover:shadow-md hover:border-blue-300 transition'><div class='w-11 h-11 rounded-xl bg-blue-50 text-blue-700 flex items-center justify-center mb-4'>${icon(c[4])}</div><h3 class='font-semibold text-lg'>${c[1]}</h3><p class='text-sm text-slate-500 mt-2 min-h-10'>${c[2]}</p><div class='mt-5 flex justify-between text-sm'><span class='text-slate-500'>${c[3]}个高频问题</span><span class='text-blue-700'>进入模块 →</span></div></button>`).join('')}</div><div class='mt-8'>${notice()}</div></section></main>`}
function score(f,q){q=q.trim().toLowerCase(); if(!q)return 0; let s=0, title=f.question.toLowerCase(); if(title===q)s+=100;if(title.includes(q))s+=60;if(f.keywords.some(k=>k.toLowerCase().includes(q)||q.includes(k.toLowerCase())))s+=40;if(f.answer.toLowerCase().includes(q))s+=20;if(f.categoryName.toLowerCase().includes(q))s+=10; q.split(/\s+/).forEach(w=>{if(title.includes(w))s+=15; f.keywords.forEach(k=>{if(k.includes(w))s+=10})});return s}
function card(f){return `<button onclick="detail('${f.id}')" class='w-full text-left bg-white border rounded-xl p-5 hover:border-blue-300 hover:shadow-sm'><div class='flex gap-3 justify-between'><div><div class='text-xs text-blue-700 font-medium mb-2'>${f.categoryName}</div><h3 class='font-semibold text-lg'>${esc(f.question)}</h3><div class='mt-3 flex flex-wrap gap-1'>${f.keywords.map(k=>`<span class='text-xs px-2 py-1 bg-slate-100 rounded-md'>${esc(k)}</span>`).join('')}</div><p class='text-sm text-slate-500 mt-3 line-clamp-2'>${esc(f.answer)}</p></div><span class='text-blue-700 shrink-0'>${icon('chevron-right')}</span></div></button>`}
function listPage(){let arr=data.filter(f=>f.status==='published');if(state.cat!=='all')arr=arr.filter(f=>f.category===state.cat);if(state.query)arr=arr.map(f=>[f,score(f,state.query)]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);return `<main class='max-w-5xl mx-auto px-4 py-10'><button onclick="go('home')" class='text-sm text-slate-500 flex gap-1 mb-5'>${icon('arrow-left','w-4 h-4')} 返回首页</button><h1 class='text-3xl font-bold'>${state.query?'搜索结果':'全部问题'}</h1>${state.query?`<p class='text-slate-500 mt-2'>关键词“${esc(state.query)}”，共找到 ${arr.length} 条相关问题</p>`:`<p class='text-slate-500 mt-2'>按模块浏览或搜索跨境业务高频问题</p>`}<div class='mt-6'>${searchBox(state.query)}</div><div class='mt-6 flex gap-2 flex-wrap'>${[['all','全部'],...cats.map(c=>[c[0],c[1]])].map(c=>`<button onclick="filterCat('${c[0]}')" class='px-3 py-2 rounded-lg text-sm ${state.cat===c[0]?'bg-blue-700 text-white':'bg-white border'}'>${c[1]}</button>`).join('')}</div><div class='mt-6 grid gap-3'>${arr.length?arr.map(card).join(''):`<div class='bg-white border rounded-2xl py-16 text-center'>${icon('search','w-10 h-10 mx-auto text-slate-300')}<h3 class='mt-4 font-semibold'>暂未找到相关问题</h3><p class='text-slate-500 text-sm mt-2'>可以尝试更换关键词，例如：购汇、额度、留学、汇款、境外个人、跨境人民币等。</p></div>`}</div></main>`}
function detailPage(){let f=data.find(x=>x.id===state.detail);if(!f)return listPage();let rel=data.filter(x=>x.category===f.category&&x.id!==f.id&&x.status==='published').slice(0,4);return `<main class='max-w-4xl mx-auto px-4 py-10'><button onclick='history.back();go("all")' class='text-sm text-slate-500 flex gap-1 mb-5'>${icon('arrow-left','w-4 h-4')} 返回问题列表</button><div class='text-sm text-blue-700 font-medium'>${f.categoryName}</div><h1 class='text-3xl font-bold mt-2'>${esc(f.question)}</h1><div class='mt-6 bg-blue-50 border border-blue-200 rounded-2xl p-6'><div class='flex justify-between gap-4'><h2 class='font-bold text-blue-950'>标准回答</h2><button onclick="copyAns('${f.id}')" class='text-sm text-blue-700 flex gap-1'>${icon('copy','w-4 h-4')} 复制标准回答</button></div><p class='mt-3 leading-7'>${esc(f.answer)}</p></div><div class='grid md:grid-cols-2 gap-4 mt-4'><section class='bg-white border rounded-2xl p-5'><h2 class='font-bold'>办理要点</h2><ul class='mt-3 space-y-2 text-sm'>${f.keyPoints.map(x=>`<li class='flex gap-2'>✓ <span>${esc(x)}</span></li>`).join('')}</ul></section><section class='bg-white border rounded-2xl p-5'><h2 class='font-bold'>所需材料</h2><ul class='mt-3 space-y-2 text-sm'>${f.materials.map(x=>`<li class='flex gap-2'>□ <span>${esc(x)}</span></li>`).join('')}</ul></section></div><section class='mt-4 rounded-2xl border border-amber-200 bg-amber-50 p-5'><h2 class='font-bold text-amber-900'>合规提示</h2><ul class='mt-3 space-y-2 text-sm text-amber-900'>${f.compliance.map(x=>`<li>• ${esc(x)}</li>`).join('')}</ul></section><div class='mt-4 bg-white border rounded-2xl p-5 text-sm'><div><b>来源：</b>${esc(f.source)}</div><div class='mt-2'><b>更新时间：</b>${f.updateTime}</div></div><section class='mt-8'><h2 class='font-bold text-xl mb-3'>相关问题</h2><div class='grid gap-2'>${rel.map(card).join('')}</div></section><div class='mt-8'>${notice()}</div></main>`}
function admin(){let arr=data.filter(f=>(state.adminCat==='all'||f.category===state.adminCat)&&(!state.adminQuery||f.question.includes(state.adminQuery)||f.keywords.join(' ').includes(state.adminQuery)));return `<main class='max-w-6xl mx-auto px-4 py-10'><div class='flex flex-col md:flex-row md:justify-between md:items-center gap-4'><div><h1 class='text-3xl font-bold'>FAQ 管理</h1><p class='text-slate-500 mt-1'>维护跨境业务知识库 · 当前 ${data.length} 条</p></div><div class='flex flex-wrap gap-2'><button onclick='openChangePassword()' class='border bg-white rounded-xl px-4 py-2 flex items-center gap-2'>${icon('key-round','w-4 h-4')} 修改密码</button><button onclick='editFaq()' class='bg-blue-700 text-white rounded-xl px-4 py-2 flex gap-2'>${icon('plus')} 新增 FAQ</button></div></div><div class='mt-6 bg-white border rounded-xl p-4 flex flex-col md:flex-row gap-3'><input id='aq' value='${esc(state.adminQuery)}' placeholder='搜索问题或关键词' class='border rounded-lg px-3 py-2 flex-1'><select id='ac' class='border rounded-lg px-3 py-2'><option value='all'>全部模块</option>${cats.map(c=>`<option value='${c[0]}' ${state.adminCat===c[0]?'selected':''}>${c[1]}</option>`).join('')}</select><button onclick='adminFilter()' class='border rounded-lg px-4 py-2'>筛选</button></div><div class='mt-4 grid gap-2'>${arr.map((f,i)=>`<div class='bg-white border rounded-xl p-4 flex flex-col md:flex-row md:items-center gap-3'><div class='text-sm text-slate-400 w-10'>${String(i+1).padStart(2,'0')}</div><div class='flex-1'><div class='font-medium'>${esc(f.question)}</div><div class='text-xs text-slate-500 mt-1'>${f.categoryName} · ${f.updateTime}</div></div><span class='text-xs px-2 py-1 rounded-full ${f.status==='published'?'bg-emerald-50 text-emerald-700':'bg-slate-100'}'>${f.status==='published'?'已发布':'已下线'}</span><div class='flex gap-2'><button onclick="toggle('${f.id}')" class='border rounded-lg px-3 py-1.5 text-sm'>${f.status==='published'?'下线':'发布'}</button><button onclick="editFaq('${f.id}')" class='border rounded-lg px-3 py-1.5 text-sm'>编辑</button><button onclick="delFaq('${f.id}')" class='border border-red-200 text-red-600 rounded-lg px-3 py-1.5 text-sm'>删除</button></div></div>`).join('')}</div></main>`}
function editor(){let f=state.editing?data.find(x=>x.id===state.editing):null;return `<main class='max-w-3xl mx-auto px-4 py-10'><button onclick="go('admin')" class='text-sm text-slate-500 flex gap-1 mb-5'>${icon('arrow-left','w-4 h-4')} 返回管理后台</button><h1 class='text-3xl font-bold'>${f?'编辑 FAQ':'新增 FAQ'}</h1><form onsubmit='saveFaq(event)' class='mt-6 bg-white border rounded-2xl p-6 space-y-4'><label class='block'><span class='text-sm font-medium'>问题标题</span><input id='fq' required value='${esc(f?.question||'')}' class='mt-1 w-full border rounded-lg px-3 py-2'></label><label class='block'><span class='text-sm font-medium'>所属模块</span><select id='fc' class='mt-1 w-full border rounded-lg px-3 py-2'>${cats.map(c=>`<option value='${c[0]}' ${f?.category===c[0]?'selected':''}>${c[1]}</option>`).join('')}</select></label><label class='block'><span class='text-sm font-medium'>关键词（逗号分隔）</span><input id='fk' value='${esc(f?.keywords?.join(',')||'')}' class='mt-1 w-full border rounded-lg px-3 py-2'></label><label class='block'><span class='text-sm font-medium'>标准回答</span><textarea id='fa' rows='5' class='mt-1 w-full border rounded-lg px-3 py-2'>${esc(f?.answer||demoAnswer)}</textarea></label><label class='block'><span class='text-sm font-medium'>状态</span><select id='fs' class='mt-1 w-full border rounded-lg px-3 py-2'><option value='published' ${f?.status!=='draft'?'selected':''}>发布</option><option value='draft' ${f?.status==='draft'?'selected':''}>下线</option></select></label><div class='flex justify-end gap-2'><button type='button' onclick="go('admin')" class='border rounded-lg px-4 py-2'>取消</button><button class='bg-blue-700 text-white rounded-lg px-5 py-2'>保存</button></div></form></main>`}
function render(){if((state.page==='admin'||state.page==='edit')&&!adminAuthed){state.page='home'}let body=state.page==='home'?home():state.page==='detail'?detailPage():state.page==='admin'?admin():state.page==='edit'?editor():listPage();document.getElementById('app').innerHTML=header()+body+mobileBottom()+`<div id='toast' class='fixed bottom-20 md:bottom-5 right-4 md:right-5 hidden bg-slate-900 text-white px-4 py-3 rounded-xl shadow-lg text-sm'></div>`;lucide.createIcons()}

function openAdminLogin(){
  const wrap=document.createElement('div');wrap.id='adminLoginModal';wrap.className='fixed inset-0 z-50 bg-slate-900/40 flex items-center justify-center p-4';
  wrap.innerHTML=`<div class='bg-white rounded-2xl shadow-xl w-full max-w-md p-6'><div class='flex items-center gap-3 mb-5'><div class='w-10 h-10 rounded-xl bg-blue-50 text-blue-700 flex items-center justify-center'>${icon('lock','w-5 h-5')}</div><div><h2 class='text-xl font-bold'>管理员验证</h2><p class='text-sm text-slate-500'>管理后台仅限授权人员使用</p></div></div><label class='block text-sm font-medium'>管理员账号<input id='adminUser' class='mt-1 w-full border rounded-lg px-3 py-2' placeholder='请输入管理员账号'></label><label class='block text-sm font-medium mt-4'>访问密码<input id='adminPass' type='password' class='mt-1 w-full border rounded-lg px-3 py-2' placeholder='请输入访问密码' onkeydown="if(event.key==='Enter')adminLogin()"></label><p id='adminErr' class='hidden text-sm text-red-600 mt-3'>账号或密码不正确</p><div class='flex justify-end gap-2 mt-6'><button onclick="document.getElementById('adminLoginModal').remove()" class='border rounded-lg px-4 py-2'>取消</button><button onclick='adminLogin()' class='bg-blue-700 text-white rounded-lg px-5 py-2'>验证并进入</button></div><p class='text-xs text-slate-400 mt-4'>演示版采用前端访问控制；正式上线时应接入银行统一身份认证和后台权限系统。</p></div>`;
  document.body.appendChild(wrap);lucide.createIcons();setTimeout(()=>document.getElementById('adminUser')?.focus(),0);
}
function adminLogin(){const u=document.getElementById('adminUser').value.trim(),p=document.getElementById('adminPass').value;if(u==='admin'&&p===getAdminPassword()){adminAuthed=true;sessionStorage.setItem('crossborder_admin_auth','1');document.getElementById('adminLoginModal')?.remove();state.page='admin';render();toast('管理员验证成功')}else document.getElementById('adminErr').classList.remove('hidden')}

function openChangePassword(){
  if(!adminAuthed){openAdminLogin();return}
  const wrap=document.createElement('div');wrap.id='changePasswordModal';wrap.className='fixed inset-0 z-50 bg-slate-900/40 flex items-center justify-center p-4';
  wrap.innerHTML=`<div class='bg-white rounded-2xl shadow-xl w-full max-w-md p-6'><div class='flex items-center gap-3 mb-5'><div class='w-10 h-10 rounded-xl bg-blue-50 text-blue-700 flex items-center justify-center'>${icon('key-round','w-5 h-5')}</div><div><h2 class='text-xl font-bold'>修改管理员密码</h2><p class='text-sm text-slate-500'>修改后，下次进入管理后台需使用新密码</p></div></div><label class='block text-sm font-medium'>当前密码<input id='oldAdminPass' type='password' class='mt-1 w-full border rounded-lg px-3 py-2' placeholder='请输入当前密码'></label><label class='block text-sm font-medium mt-4'>新密码<input id='newAdminPass' type='password' class='mt-1 w-full border rounded-lg px-3 py-2' placeholder='至少8位'></label><label class='block text-sm font-medium mt-4'>确认新密码<input id='confirmAdminPass' type='password' class='mt-1 w-full border rounded-lg px-3 py-2' placeholder='再次输入新密码' onkeydown="if(event.key==='Enter')changeAdminPassword()"></label><p id='passwordErr' class='hidden text-sm text-red-600 mt-3'></p><div class='flex justify-end gap-2 mt-6'><button onclick="document.getElementById('changePasswordModal').remove()" class='border rounded-lg px-4 py-2'>取消</button><button onclick='changeAdminPassword()' class='bg-blue-700 text-white rounded-lg px-5 py-2'>确认修改</button></div><p class='text-xs text-slate-400 mt-4'>演示版密码保存在当前浏览器本地。正式上线应由银行统一身份认证或服务端安全管理密码。</p></div>`;
  document.body.appendChild(wrap);lucide.createIcons();setTimeout(()=>document.getElementById('oldAdminPass')?.focus(),0);
}
function changeAdminPassword(){
  const oldP=document.getElementById('oldAdminPass').value;
  const newP=document.getElementById('newAdminPass').value;
  const confirmP=document.getElementById('confirmAdminPass').value;
  const err=document.getElementById('passwordErr');
  const fail=m=>{err.textContent=m;err.classList.remove('hidden')};
  if(oldP!==getAdminPassword()) return fail('当前密码不正确');
  if(newP.length<8) return fail('新密码至少需要8位');
  if(newP===oldP) return fail('新密码不能与当前密码相同');
  if(newP!==confirmP) return fail('两次输入的新密码不一致');
  localStorage.setItem(ADMIN_PASSWORD_KEY,newP);
  document.getElementById('changePasswordModal')?.remove();
  toast('管理员密码修改成功');
}

function logoutAdmin(){adminAuthed=false;sessionStorage.removeItem('crossborder_admin_auth');state.page='home';render();toast('已退出管理后台')}

function go(p){if((p==='admin'||p==='edit')&&!adminAuthed){openAdminLogin();return}state.page=p;if(p==='all'){state.query='';state.cat='all'}render();scrollTo(0,0)}function doSearch(){state.query=document.getElementById('mainSearch').value.trim();state.cat='all';state.page='list';render()}function quick(q){state.query=q;state.cat='all';state.page='list';render()}function filterCat(c){state.cat=c;render()}function openCat(c){state.cat=c;state.query='';state.page='list';render()}function detail(id){state.detail=id;state.page='detail';render();scrollTo(0,0)}function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),1800)}function copyAns(id){navigator.clipboard.writeText(data.find(x=>x.id===id).answer);toast('已复制标准回答')}function adminFilter(){state.adminQuery=document.getElementById('aq').value;state.adminCat=document.getElementById('ac').value;render()}function toggle(id){let f=data.find(x=>x.id===id);f.status=f.status==='published'?'draft':'published';save();render();toast(f.status==='published'?'已发布':'已下线')}function delFaq(id){if(confirm('确定删除该问题吗？')){data=data.filter(x=>x.id!==id);save();render();toast('删除成功')}}function editFaq(id=null){state.editing=id;state.page='edit';render()}function saveFaq(e){e.preventDefault();let cat=document.getElementById('fc').value,c=cats.find(x=>x[0]===cat);let obj={id:state.editing||'faq_'+Date.now(),category:cat,categoryName:c[1],question:document.getElementById('fq').value,keywords:document.getElementById('fk').value.split(/[,，]/).map(x=>x.trim()).filter(Boolean),answer:document.getElementById('fa').value,keyPoints:['核实客户身份信息','确认真实业务用途','按现行制度审核'],materials:['有效身份证件','业务相关证明材料'],compliance:['具体业务以现行制度和监管要求为准','工具不直接判断客户风险'],source:'内部业务资料',updateTime:new Date().toISOString().slice(0,10),status:document.getElementById('fs').value};if(state.editing){data=data.map(x=>x.id===state.editing?obj:x)}else data.push(obj);save();state.page='admin';state.editing=null;render();toast('保存成功')}
render();
</script></body></html>
